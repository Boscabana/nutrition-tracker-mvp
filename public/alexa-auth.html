<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutritionMVP - Alexa Verknüpfung</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      color: #1d1d1f;
      margin-bottom: 8px;
    }
    p {
      color: #6e6e73;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
    }
    .btn {
      background-color: #0071e3;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-bottom: 10px;
    }
    .btn:hover {
      background-color: #0077ed;
    }
    .btn-secondary {
      background-color: #e8e8ed;
      color: #1d1d1f;
    }
    .btn-secondary:hover {
      background-color: #dcdce0;
    }
    .status {
      margin-top: 16px;
      font-size: 14px;
      color: #e53935;
      word-break: break-word;
    }
    .divider {
      margin: 16px 0;
      color: #86868b;
      font-size: 12px;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="card">
    <h1>NutritionMVP 🥗</h1>
    <p>Melde dich mit deinem NutritionMVP Konto an, um deinen Haushalt mit Alexa zu verknüpfen.</p>

    <input type="email" id="email" placeholder="E-Mail-Adresse" />
    <input type="password" id="password" placeholder="Passwort" />
    <button id="emailLoginBtn" class="btn">Anmelden</button>

    <div class="divider">ODER</div>

    <button id="googleLoginBtn" class="btn btn-secondary">Mit Google anmelden</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAT7S-ToNe7eE4t_4xyW5qcxCHvZbPxIJQ",
      authDomain: "nutrition-mvp-aa293.firebaseapp.com",
      projectId: "nutrition-mvp-aa293"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const redirectUri = urlParams.get('redirect_uri');
    const state = urlParams.get('state');

    firebase.initializeApp(firebaseConfig);

    async function handleSuccess(user) {
      const statusEl = document.getElementById('status');
      statusEl.style.color = '#4caf50';
      statusEl.innerText = "Verknüpfung erfolgreich! Weiterleitung...";
      const idToken = await user.getIdToken();

      if (redirectUri && state) {
        const redirectUrl = `${redirectUri}#access_token=${encodeURIComponent(idToken)}&state=${encodeURIComponent(state)}&token_type=Bearer`;
        window.location.href = redirectUrl;
      } else {
        statusEl.innerText = "Erfolgreich angemeldet!";
      }
    }

    document.getElementById('emailLoginBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const statusEl = document.getElementById('status');

      if (!email || !password) {
        statusEl.style.color = '#e53935';
        statusEl.innerText = "Bitte E-Mail und Passwort eingeben.";
        return;
      }

      statusEl.style.color = '#6e6e73';
      statusEl.innerText = "Anmeldung läuft...";

      try {
        const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
        await handleSuccess(userCredential.user);
      } catch (err) {
        console.error(err);
        statusEl.style.color = '#e53935';
        statusEl.innerText = "Fehler: " + (err.message || err);
      }
    });

    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
      const statusEl = document.getElementById('status');
      statusEl.style.color = '#6e6e73';
      statusEl.innerText = "Anmeldung läuft...";

      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await firebase.auth().signInWithPopup(provider);
        await handleSuccess(result.user);
      } catch (err) {
        console.error(err);
        statusEl.style.color = '#e53935';
        statusEl.innerText = "Fehler: " + (err.message || err);
      }
    });
  </script>
</body>
</html>
